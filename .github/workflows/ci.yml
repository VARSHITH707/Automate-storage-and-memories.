name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring  # tests use their own in-memory keyring
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install (pinned runtime dependencies, then the package and dev tools)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy captioner
      - name: Tests (no accounts, no models, no network)
        run: python -m pytest -rs --cov=captioner --cov-report=term
      - name: CLI help and offline demo
        shell: bash
        run: |
          captioner --help
          captioner doctor --offline || true
          captioner demo --output demo-output
      - name: Build package
        run: python -m build
      - name: Dependency vulnerability audit
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt
